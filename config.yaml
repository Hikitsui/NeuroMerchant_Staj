behaviors:
  MerchantAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048       # [YÜKSELTİLDİ] 1271 veri ve LSTM için daha geniş veri paketi
      buffer_size: 20480     # [YÜKSELTİLDİ] Batch boyutuna uygun tampon bellek
      learning_rate: 0.0003
      beta: 0.015            # Ajan yeni rotalar denemeye devam edecek
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true        # [AKTİF] 1271 farklı sinyali (para, mesafe, 0-1'ler) pürüzsüzleştirir
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
      memory:
        sequence_length: 64
        memory_size: 256
    reward_signals:
      extrinsic:
        gamma: 0.995         # [YÜKSELTİLDİ] Ajan artık 500 adım sonraki kârı hedefleyebilecek
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 1000000000
    time_horizon: 1000       # [YÜKSELTİLDİ] Uzun yolculukları tek parça halinde analiz etmesi için
    summary_freq: 10000